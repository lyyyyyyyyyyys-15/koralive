<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاهدة المباراة - kora live</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a1a3e, #16213e);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 2px solid #e94560;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header a { color: #8899aa; text-decoration: none; font-size: 22px; }
    header a:hover { color: #e94560; }
    header h1 { font-size: 18px; font-weight: 700; flex: 1; text-align: center; }
    .container { max-width: 1100px; margin: auto; padding: 20px; }
    .match-header {
      background: linear-gradient(135deg, #1a1a3e, #16213e);
      border-radius: 16px; padding: 25px; text-align: center;
      border: 1px solid #2a2a4e; margin-bottom: 20px;
    }
    .teams-big {
      display: flex; justify-content: center; align-items: center; gap: 30px; margin: 10px 0;
    }
    .teams-big .team { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .teams-big .team .logo { width: 64px; height: 64px; border-radius: 50%; background: #2a2a4e; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .teams-big .team .logo img { width: 100%; height: 100%; object-fit: contain; }
    .teams-big .team .name { font-size: 18px; font-weight: 700; }
    .teams-big .vs { font-size: 24px; font-weight: 900; color: #e94560; }
    .match-meta { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; color: #8899aa; font-size: 13px; }
    .info-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #2a2a4e;
    }
    .info-tag {
      font-size: 12px;
      background: #1a1a2e;
      padding: 5px 12px;
      border-radius: 10px;
    }
    .info-tag.channel { color: #4fc3f7; border: 1px solid rgba(79,195,247,0.2); }
    .info-tag.commentator { color: #ffb74d; border: 1px solid rgba(255,183,77,0.2); }
    .player-section {
      background: #000; border-radius: 16px; overflow: hidden;
      position: relative; min-height: 450px; border: 1px solid #2a2a4e;
    }
    .player-section iframe { width: 100%; height: 500px; border: none; display: block; }
    .loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0f0f1a; z-index: 10;
    }
    .loading-overlay.hidden { display: none; }
    .spinner { width: 50px; height: 50px; border: 4px solid #2a2a4e; border-top-color: #e94560; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay p { margin-top: 15px; color: #8899aa; }
    .servers {
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0;
    }
    .servers button {
      background: #16213e; color: #fff; border: 2px solid #2a2a4e;
      padding: 8px 20px; border-radius: 10px; cursor: pointer;
      font-family: 'Tajawal', sans-serif; font-size: 14px; font-weight: 700; transition: 0.3s;
    }
    .servers button:hover { border-color: #e94560; }
    .servers button.active { background: #e94560; border-color: #e94560; }
    .error-msg { background: #e94560; padding: 15px; border-radius: 10px; text-align: center; margin: 20px 0; display: none; }
    .no-stream-box { text-align: center; padding: 60px 20px; color: #667; }
    .no-stream-box .big-icon { font-size: 60px; margin-bottom: 15px; }
    @media (max-width: 600px) {
      .player-section iframe { height: 280px; }
      .player-section { min-height: 280px; }
      .teams-big { gap: 15px; }
      .teams-big .team .logo { width: 48px; height: 48px; }
      .teams-big .team .name { font-size: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">←</a>
    <h1 id="matchTitle">المباراة</h1>
  </header>

  <div class="container">
    <div class="match-header" id="matchInfo"></div>
    <div class="servers" id="serverButtons"></div>
    <div class="player-section" id="playerSection">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>جارٍ تجهيز البث...</p>
      </div>
      <iframe id="player" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div style="text-align:center;margin:25px 0">
      <a href="index.html" style="color:#8899aa;text-decoration:none">← العودة</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="matches-data.js"></script>
  <script>
    const matchId = new URLSearchParams(window.location.search).get('id');
    const GAS_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';

    async function loadMatch() {
      if (!matchId) { showError('معرف المباراة غير موجود'); return; }

      try {
        document.querySelector('#matchInfo').innerHTML = '<div style="text-align:center;padding:30px"><div class="spinner" style="margin:auto"></div></div>';

        let m, kooraSources = [];
        let localData = null;

        try {
          const res = await fetch(CONFIG.SPORTSRC_BASE + '?data=detail&id=' + encodeURIComponent(matchId) + '&category=football');
          const json = await res.json();
          if (json.success && json.data) {
            m = json.data;
            kooraSources = CONFIG.KOORA_SOURCES[matchId] || [];
          }
        } catch (e) {}

        if (!m) {
          localData = matchesData.find(x => x.id === matchId);
          if (!localData) { showError('لم يتم العثور على المباراة'); document.querySelector('#matchInfo').innerHTML = ''; return; }
          m = {
            id: localData.id,
            title: localData.team1.name + ' vs ' + localData.team2.name,
            date: new Date(localData.date + 'T' + (localData.time || '20:00') + ':00').getTime(),
            teams: {
              home: { name: localData.team1.name, badge: localData.team1.logo || '' },
              away: { name: localData.team2.name, badge: localData.team2.logo || '' }
            },
            sources: (localData.sources || []).map(s => ({ embedUrl: s, hd: true }))
          };
          kooraSources = [];
        }

        const info = CONFIG.MATCH_INFO[matchId] || {};
        const enriched = {
          league: info.league || localData?.league || '',
          channels: info.channels || localData?.channels || [],
          commentator: info.commentator || localData?.commentator || CONFIG.LEAGUE_CHANNELS[localData?.league]?.commentator || ''
        };
        renderMatchInfo(m, enriched);

        if (!m.sources || !m.sources.length) {
          document.getElementById('playerSection').innerHTML =
            '<div class="no-stream-box"><div class="big-icon">📺</div><h2>لا يوجد بث متاح</h2><p style="color:#667;margin-top:10px">سيتم إضافة البث لاحقاً</p></div>';
          document.getElementById('serverButtons').innerHTML = '';
          return;
        }

        let allSources = [];
        m.sources.forEach((s, i) => {
          allSources.push({ label: 'سيرفر ' + (i + 1) + (s.hd ? ' HD' : ''), type: 'sportsrc', url: s.embedUrl });
        });
        kooraSources.forEach((url, i) => {
          allSources.push({ label: 'كوورة ' + (i + 1), type: 'kooora', url });
        });

        if (allSources.length === 0) {
          document.getElementById('playerSection').innerHTML =
            '<div class="no-stream-box"><div class="big-icon">📺</div><h2>لا يوجد بث متاح</h2><p style="color:#667;margin-top:10px">سيتم إضافة البث لاحقاً</p></div>';
          document.getElementById('serverButtons').innerHTML = '';
          return;
        }

        const btnContainer = document.getElementById('serverButtons');
        btnContainer.innerHTML = '';
        allSources.forEach((src, i) => {
          const btn = document.createElement('button');
          btn.textContent = src.label;
          if (src.type === 'kooora') btn.style.borderColor = '#e94560';
          btn.onclick = () => loadSource(src, i);
          if (i === 0) btn.classList.add('active');
          btnContainer.appendChild(btn);
        });

        await loadSource(allSources[0], 0);

      } catch (err) {
        showError('خطأ: ' + err.message);
      }
    }

    function renderMatchInfo(m, enriched) {
      document.title = m.teams.home.name + ' vs ' + m.teams.away.name + ' | kora live';
      document.getElementById('matchTitle').textContent = m.teams.home.name + ' vs ' + m.teams.away.name;

      const d = new Date(m.date);
      const dateStr = d.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: false });

      let infoHtml = '';
      if (enriched.league) infoHtml += `<span class="info-tag">${enriched.league}</span>`;
      enriched.channels.forEach(ch => { infoHtml += `<span class="info-tag channel">${ch}</span>`; });
      if (enriched.commentator) infoHtml += `<span class="info-tag commentator">المعلق: ${enriched.commentator}</span>`;

      document.getElementById('matchInfo').innerHTML = `
        <div class="teams-big">
          <div class="team">
            <div class="logo"><img src="${m.teams.home.badge}" alt="" onerror="this.style.display='none'"></div>
            <div class="name">${m.teams.home.name}</div>
          </div>
          <div class="vs">VS</div>
          <div class="team">
            <div class="logo"><img src="${m.teams.away.badge}" alt="" onerror="this.style.display='none'"></div>
            <div class="name">${m.teams.away.name}</div>
          </div>
        </div>
        <div class="match-meta">
          <span>${dateStr}</span>
          <span>|</span>
          <span>${timeStr}</span>
        </div>
        ${infoHtml ? `<div class="info-bar">${infoHtml}</div>` : ''}
      `;
    }

    async function loadSource(src, index) {
      const player = document.getElementById('player');
      const loading = document.getElementById('loadingOverlay');
      const errorMsg = document.getElementById('errorMsg');

      loading.classList.remove('hidden');
      player.style.display = 'none';
      errorMsg.style.display = 'none';

      document.querySelectorAll('.servers button').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      try {
        if (src.type === 'sportsrc') {
          player.src = src.url;
          player.style.display = 'block';
          loading.classList.add('hidden');
        } else if (src.type === 'kooora') {
          const res = await fetch(GAS_URL + '?url=' + encodeURIComponent(src.url));
          const data = await res.json();
          if (data.success && data.iframes.length > 0) {
            player.srcdoc = data.iframes[0];
            player.style.display = 'block';
            loading.classList.add('hidden');
          } else {
            showError('لم يتم العثور على بث في هذا الرابط');
            loading.classList.add('hidden');
          }
        }
      } catch (err) {
        showError(src.type === 'kooora' ? 'فشل الاتصال: تأكد من نشر Google Apps Script' : 'فشل تحميل البث: ' + err.message);
        loading.classList.add('hidden');
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    loadMatch();
  </script>
</body>
</html>
